<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bookkeeping</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', sans-serif;
}

body{
    background:#020617;
    color:white;
    overflow-x:hidden;
}

/* 배경 */

.bg1{
    position:fixed;
    width:900px;
    height:900px;
    background:#2563eb;
    filter:blur(320px);
    opacity:0.08;
    top:-350px;
    right:-350px;
    z-index:-1;
}

.bg2{
    position:fixed;
    width:700px;
    height:700px;
    background:#7c3aed;
    filter:blur(280px);
    opacity:0.06;
    bottom:-250px;
    left:-250px;
    z-index:-1;
}

/* 사이드바 */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:270px;
    height:100vh;
    background:rgba(8,12,24,0.96);
    backdrop-filter:blur(20px);
    border-right:1px solid rgba(255,255,255,0.05);
    padding:28px 20px;
}

.logo{
    font-size:34px;
    font-weight:900;
    margin-bottom:55px;
}

.menu-item{
    width:100%;
    padding:16px 18px;
    border-radius:18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
    color:#cbd5e1;
}

.menu-item:hover{
    background:#1e293b;
}

.active{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
}

/* 메인 */

.main{
    margin-left:270px;
    padding:35px;
}

/* 상단 */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:20px;
}

.page-title{
    font-size:46px;
    font-weight:900;
}

.clock{
    background:#111827;
    padding:14px 18px;
    border-radius:16px;
    font-weight:700;
}

/* 통계 */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
    margin-bottom:28px;
}

.stat-card{
    background:rgba(15,23,42,0.92);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:30px;
    padding:28px;
    backdrop-filter:blur(16px);
}

.stat-title{
    color:#94a3b8;
    margin-bottom:14px;
}

.stat-value{
    font-size:38px;
    font-weight:900;
}

.up{
    margin-top:10px;
    color:#22c55e;
}

/* 카드 */

.card{
    background:rgba(15,23,42,0.92);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:30px;
    padding:28px;
    backdrop-filter:blur(16px);
}

/* 장부 테이블 */

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    color:#94a3b8;
    padding-bottom:18px;
}

td{
    padding:18px 0;
    border-top:1px solid rgba(255,255,255,0.05);
}

.success{
    color:#4ade80;
    font-weight:700;
}

.cancel{
    color:#f87171;
    font-weight:700;
}

.wait{
    color:#e4e4e7;
    font-weight:700;
}

/* 모바일 */

@media(max-width:768px){

    .sidebar{
        width:100%;
        height:auto;
        position:relative;
    }

    .main{
        margin-left:0;
        padding:22px;
    }

    table{
        font-size:14px;
    }

}

</style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<!-- 사이드바 -->

<div class="sidebar">

    <div class="logo">
        LIVON
    </div>

    <div class="menu-item">
        Dashboard
    </div>

    <div class="menu-item">
        Users
    </div>

    <div class="menu-item">
        Orders
    </div>

    <div class="menu-item">
        Payments
    </div>

    <div class="menu-item active">
        Bookkeeping
    </div>

</div>

<!-- 메인 -->

<div class="main">

    <!-- 상단 -->

    <div class="topbar">

        <div class="page-title">
            회계 장부
        </div>

        <div class="clock" id="clock">
            00:00:00
        </div>

    </div>

    <!-- 통계 -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-title">
                총 매출
            </div>

            <div class="stat-value"
            id="totalRevenue">
                ₩0
            </div>

            <div class="up">
                실시간 집계중
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-title">
                결제 완료
            </div>

            <div class="stat-value"
            id="totalSuccess">
                0
            </div>

            <div class="up">
                정상 처리
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-title">
                주문 취소
            </div>

            <div class="stat-value"
            id="totalCancel">
                0
            </div>

            <div class="up">
                실시간 반영
            </div>

        </div>

    </div>

    <!-- 회계 테이블 -->

    <div class="card">

        <table>

            <thead>

                <tr>
                    <th>회원</th>
                    <th>상품</th>
                    <th>금액</th>
                    <th>상태</th>
                    <th>날짜</th>
                </tr>

            </thead>

            <tbody id="ordersTable">

                <!-- main.js 자동출력 -->

            </tbody>

        </table>

    </div>

</div>

<script src="main.js"></script>

</body>
</html>
