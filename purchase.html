<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>구매 완료</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', sans-serif;
}

body{
    background:#0f1115;
}

.purchase-complete{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    padding:20px;
}

.check-icon{
    width:100px;
    height:100px;
    border-radius:50%;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    margin-bottom:30px;
    box-shadow:0 15px 40px rgba(34,197,94,0.35);
    animation:pop 0.5s ease;
}

@keyframes pop{
    0%{
        transform:scale(0);
    }
    100%{
        transform:scale(1);
    }
}

.purchase-complete h1{
    font-size:44px;
    margin-bottom:12px;
}

.sub-text{
    font-size:18px;
    color:#9ca3af;
    margin-bottom:28px;
}

.order-number{
    background:#1a1d24;
    border:1px solid rgba(255,255,255,0.08);
    padding:16px 28px;
    border-radius:16px;
    margin-bottom:35px;
    font-size:16px;
    color:#d1d5db;
}

.button-group{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:15px;
}

.button-group button{
    border:none;
    padding:15px 30px;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    font-weight:600;
}

.home-btn{
    background:#2563eb;
    color:white;
}

.order-btn{
    background:#1f2937;
    color:white;
}

.cancel-btn{
    background:#dc2626;
    color:white;
}

.button-group button:hover{
    transform:translateY(-4px);
    opacity:0.92;
}

.auto-move{
    margin-top:25px;
    color:#6b7280;
    font-size:14px;
}

.status-text{
    margin-top:18px;
    font-size:15px;
    color:#f87171;
    display:none;
}

</style>
</head>

<body>

<div class="purchase-complete">

    <div class="check-icon">
        ✓
    </div>

    <h1>구매했습니다</h1>

    <p class="sub-text">
        주문이 정상적으로 완료되었습니다.
    </p>

    <div class="order-number">
        주문번호 : NO-2026-0515
    </div>

    <div class="button-group">

        <button class="home-btn"
        onclick="goHome()">
            홈으로
        </button>

        <button class="order-btn"
        onclick="goOrderPage()">
            주문확인
        </button>

        <button class="cancel-btn"
        onclick="cancelOrder()">
            주문취소
        </button>

    </div>

    <div class="status-text" id="statusText">
        주문이 취소되었습니다.
    </div>

    <div class="auto-move">
        5초 후 메인페이지로 자동 이동됩니다.
    </div>

</div>

<script>

function goHome(){
    location.href = "index.html";
}

function goOrderPage(){
    location.href = "mypage.html";
}

function cancelOrder(){

    const result = confirm("주문을 취소하시겠습니까?");

    if(result){

        document.getElementById("statusText").style.display = "block";

        alert("주문이 취소되었습니다.");

        setTimeout(() => {

            location.href = "index.html";

        }, 1500);

    }

}

setTimeout(() => {

    location.href = "index.html";

}, 5000);

</script>

</body>
</html>
